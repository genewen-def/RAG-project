name: rag-hub
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python 版本
  - python=3.11
  
  # PyTorch 系列（建议用 conda 安装，GPU 支持更好）
  - pytorch>=2.10.0
  - torchvision>=0.25.0
  - torchaudio>=2.10.0
  
  # 数值计算
  - numpy>=2.4.3
  - pandas>=3.0.1
  
  # 其他 conda 可装的包
  - regex>=2026.2.28
  - requests>=2.32.5
  
  # pip 依赖（conda 里没有或版本不一致的包）
  - pip
  - pip:
    # Web 框架
    - fastapi>=0.135.1
    - uvicorn>=0.42.0
    - python-multipart>=0.0.22
    
    # LangChain 生态
    - langchain>=1.2.12
    - langchain-community>=0.4.1
    - langchain-openai>=1.1.11
    - langgraph>=1.1.2
    - openai-agents>=0.4.2
    
    # 向量数据库
    - pymilvus[model]>=2.6.10
    - pymilvus-model>=0.3.2
    
    # 文档处理
    - magic-pdf>=1.3.12
    
    # Embedding & Reranker
    - FlagEmbedding>=1.3.5
    - transformers>=4.57.6
    - modelscope>=1.35.0
    
    # 其他工具
    - loguru>=0.7.3
    - minio>=7.2.20
    - pymongo>=4.16.0
    - python-dotenv>=1.2.2
    - grandalf>=0.8
